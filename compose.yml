services:
  web:
    build: .
    container_name: work_board
    ports:
      - "8009:8000"
    volumes:
      - .:/app
      - /staticfiles
      - whisper_cache:/root/.cache/whisper
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings
      - STATIC_ROOT=/staticfiles
      - CUDA_VISIBLE_DEVICES=-1

# Объявляем именованный том
volumes:
  whisper_cache: