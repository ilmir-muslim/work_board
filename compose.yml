services:
  web:
    build: .
    container_name: work_board
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # 5. Кэш для весов Whisper
      - whisper_cache:/root/.cache/whisper
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings

# Объявляем именованный том
volumes:
  whisper_cache: